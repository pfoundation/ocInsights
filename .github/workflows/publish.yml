name: publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for the npm trusted publisher (+ provenance signing)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - name: Set version from tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          TAG="${RELEASE_TAG#v}"
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version from tag: $RELEASE_TAG"; exit 1
          fi
          if [[ "$PRERELEASE" == "true" ]] || [[ "$TAG" == *-* ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi
          npm pkg set version="$TAG"
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "publishing $(node -p "require('./package.json').version") from $RELEASE_TAG (prerelease: $PRERELEASE) with dist-tag $DIST_TAG"
      - run: bun run typecheck
      - run: bun plugin/shim-check.ts
      - run: bun plugin/log-check.ts
      - run: npm pack --dry-run
      # auth is OIDC via the trusted publisher configured on npmjs.com (org pfoundation,
      # repo ocInsights, workflow publish.yml); setup-node's registry-url is still needed
      # so the npm CLI targets the public registry before exchanging the OIDC token.
      - run: npm publish --access public --tag "$DIST_TAG"
